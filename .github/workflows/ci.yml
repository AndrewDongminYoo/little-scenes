name: Native validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: little-scenes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p evidence
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npm run render:check
      - run: npx expo export --platform all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skia-render-evidence
          path: examples/*.png
          retention-days: 3
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: mkdir -p evidence
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Maestro CLI
        run: |
          curl -LsSf https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: bash scripts/ci-android-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-native-evidence
          path: |
            evidence/
            ~/.maestro/tests/
          retention-days: 3
  ios:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p evidence
      - name: Boot explicit iPhone simulator
        timeout-minutes: 5
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "IOS_SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -LsSf https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Probe iOS driver before app build
        timeout-minutes: 7
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: |
          maestro --version
          maestro --device "$IOS_SIMULATOR_UDID" test --format junit --output evidence/ios-driver.xml .maestro/ios-driver-preflight.yaml
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build unsigned simulator app
        run: |
          xcodebuild -workspace ios/LittleScenes.xcworkspace -scheme LittleScenes -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Archive diagnostic simulator app
        run: tar -czf "$RUNNER_TEMP/LittleScenes.app.tar.gz" -C build/Build/Products/Release-iphonesimulator LittleScenes.app
      - name: Preserve diagnostic simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-diagnostic-app
          path: ${{ runner.temp }}/LittleScenes.app.tar.gz
          retention-days: 3
      - name: Install simulator app
        run: xcrun simctl install "$IOS_SIMULATOR_UDID" build/Build/Products/Release-iphonesimulator/LittleScenes.app
      - name: iOS repeated playback regression
        timeout-minutes: 10
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: maestro --device "$IOS_SIMULATOR_UDID" test --format junit --output evidence/ios-playback.xml .maestro/rain-playback.yaml
      - name: iOS smoke test
        timeout-minutes: 10
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: maestro --device "$IOS_SIMULATOR_UDID" test --format junit --output evidence/ios.xml .maestro/smoke.yaml
      - name: Collect iOS failure diagnostics
        if: failure()
        run: bash scripts/collect-ios-diagnostics.sh
      - name: Verify native PNG output
        run: |
          DATA=$(xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" kr.donminzzi.littlescenes data)
          cp -R "$DATA/Library/Caches/little-scenes" evidence/ios-png
          python3 scripts/verify-png.py evidence/ios-png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-native-evidence
          path: |
            evidence/
            ~/.maestro/tests/
          retention-days: 3
