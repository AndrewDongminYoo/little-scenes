id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch@2.3.2 and picomatch@4.0.7 have no patched release as of 2026-11-18. GitHub advisory data reports no first patched version for the affected range <= 4.0.7, and npm view picomatch versions ends at 4.0.7. Reachability evidence: npm ls picomatch --all reaches it only through build tooling (expo > @expo/cli, @expo/metro-config, @expo/metro > metro-file-map > micromatch, jest-util; react-native > tinyglobby), the app source imports no glob library, and a grep of npx expo export --platform all output (web JS and iOS/Android Hermes bundles) finds no picomatch, micromatch or extglob while an app string matches all three platforms. Re-evaluate before passing user-supplied glob patterns to any tool. Approved on 2026-11-18. Remove when a picomatch release outside the affected range is available."
