appId: kr.donminzzi.littlescenes
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: scene-embroidery
    timeout: 60000
- takeScreenshot: evidence/gallery
- tapOn:
    id: scene-embroidery
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 30000
- tapOn:
    id: edit-phrase
- tapOn:
    id: phrase-input
- eraseText: 100
- inputText: Little Scenes
- tapOn:
    id: apply-phrase
- tapOn:
    id: immersive
# Android's first-use immersive education overlay can appear after the UI transition.
# This is only the OS acknowledgement button, not a permission or app assertion bypass.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: android:id/ok
          optional: true
- takeScreenshot: evidence/embroidery
- tapOn:
    point: 50%,50%
- assertVisible:
    id: edit-phrase
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 60000
- tapOn:
    id: share
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: Copy
          timeout: 60000
- takeScreenshot: evidence/embroidery-share-sheet
- stopApp
- launchApp:
    clearState: false
- tapOn:
    id: scene-rain
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 60000
# Reduced Motion/CI animation settings can start this scene paused.
# Normalize to playing, then verify the actual pause transition on both platforms.
- runFlow:
    when:
      visible: 재생
    commands:
      - tapOn: 재생
- assertVisible: 일시정지
- tapOn: 일시정지
- assertVisible: 재생
- tapOn:
    id: immersive
# Android's first-use immersive education overlay can appear after the UI transition.
# This is only the OS acknowledgement button, not a permission or app assertion bypass.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: android:id/ok
          optional: true
- takeScreenshot: evidence/rain
- tapOn:
    point: 50%,50%
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 60000
- tapOn:
    id: share
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: Copy
          timeout: 60000
- takeScreenshot: evidence/rain-share-sheet

- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: scene-scratch
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: scene-scratch
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 60000
- assertVisible: 긁은 면적 0%
- tapOn:
    id: scratch-debris
- assertVisible: '가루: 주변에 남기'
- tapOn:
    id: immersive
# Android's first-use immersive education overlay can appear after the UI transition.
# This is only the OS acknowledgement button, not a permission or app assertion bypass.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: android:id/ok
          optional: true
- swipe:
    start: 22%,52%
    end: 78%,58%
    duration: 900
- takeScreenshot: evidence/scratch-partial
- tapOn:
    point: 50%,20%
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 10000
- assertVisible: '긁은 면적 ([1-9][0-9]?|100)%'
- tapOn:
    id: scratch-font
- extendedWaitUntil:
    visible:
      id: share
      enabled: true
    timeout: 60000
- assertVisible: '글꼴: 고딕'
- assertVisible: '긁은 면적 ([1-9][0-9]?|100)%'
- tapOn:
    id: share
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: Copy
          timeout: 60000
- takeScreenshot: evidence/scratch-share-sheet
- stopApp
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: scene-scratch
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: scene-scratch
- extendedWaitUntil:
    visible:
      id: scratch-reveal
      enabled: true
    timeout: 60000
- assertVisible: '가루: 주변에 남기'
- assertVisible: '글꼴: 고딕'
- tapOn:
    id: scratch-reveal
- assertVisible: 긁은 면적 100%
- takeScreenshot: evidence/scratch-revealed
- tapOn:
    id: scratch-reset
- assertVisible: 긁은 면적 0%
